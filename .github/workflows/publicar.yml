# Publica o site principal sozinho na Hostinger a cada push no main (o dono não precisa mais enviar zip).
# Envia SÓ os arquivos do site (index.html, robots.txt, sitemap.xml, .htaccess, privacidade/, termos/, site/ e as pastas listadas em paginas.txt) para a pasta do site por FTP com criptografia (FTPS).
# As outras pastas do public_html (familia, lab, loja, portal, prof, sistema...) nunca são tocadas:
# a ação só mexe nos arquivos que ela mesma enviou (guarda a lista em .ftp-deploy-sync-state.json no servidor).
# Precisa de 4 segredos no ambiente "producao" do GitHub (Settings > Environments > producao, só a branch main), criados pelo dono:
#   FTP_SERVIDOR, FTP_USUARIO, FTP_SENHA e FTP_PASTA (ex.: public_html/ ou domains/quarksedu.com.br/public_html/)
name: Publicar o site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publicar-site
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    # A41 (16/11/2026): os segredos do FTP moram no ambiente "producao" (Settings > Environments), que só aceita a branch main.
    # Uma ação rodando em outra branch não consegue ler a senha.
    environment: producao
    timeout-minutes: 15
    steps:
      # ações de terceiros presas pelo código exato (SHA), não pela etiqueta, que o autor pode mover (auditoria A41, 16/11/2026)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Verificar antes de enviar (se falhar, nada vai para o ar)
        run: python3 scripts/verificar_tudo.py
      - name: Separar só os arquivos do site
        run: |
          mkdir _publicar
          cp index.html robots.txt sitemap.xml .htaccess _publicar/
          for p in $(cat paginas.txt); do cp -r "$p" _publicar/; done   # páginas geradas por scripts/gerar_paginas.py
          cp -r site privacidade termos _publicar/
      # 23/11/2026: de 17/11 a 22/11 a rotina ficou verde gravando numa pasta que não é a do site (o FTP_PASTA do ambiente producao).
      # Agora ela descobre a pasta certa: a raiz do site é a que tem as pastas dos outros sistemas (sistema, loja, lab). Sem achar, nada é enviado.
      - name: Descobrir a pasta do site no servidor (a que tem sistema, loja e lab)
        id: pasta
        env:
          S: ${{ secrets.FTP_SERVIDOR }}
          U: ${{ secrets.FTP_USUARIO }}
          P: ${{ secrets.FTP_SENHA }}
          D: ${{ secrets.FTP_PASTA }}
        run: |
          for c in "$D" "./" "public_html/" "domains/quarksedu.com.br/public_html/"; do
            [ -z "$c" ] && continue; c="${c%/}/"
            l=$(curl -s --ssl-reqd --max-time 30 --list-only --user "$U:$P" "ftp://$S/$c" || true)
            if printf '%s\n' "$l" | grep -qx sistema && printf '%s\n' "$l" | grep -qx loja && printf '%s\n' "$l" | grep -qx lab; then
              echo "dir=$c" >> "$GITHUB_OUTPUT"; echo "Pasta do site encontrada."; exit 0; fi
          done
          echo "Não achei a pasta do site (com sistema, loja e lab) pelo FTP: nada foi enviado."; exit 1
      - name: Enviar por FTP para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65   # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          server-dir: ${{ steps.pasta.outputs.dir }}   # a pasta conferida no passo anterior
          protocol: ftps   # usuário e senha viajam cifrados (FTP com TLS explícito, porta 21)
          local-dir: ./_publicar/
          dangerous-clean-slate: false
